<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Låtquiz – Gå med i spel</title>
  <meta name="description" content="Gå med i ett låtquiz med din enhet och gissa artist och titel.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const d = document.documentElement.dataset, t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {}</script>
</head>
<body>
  <p id="announce" class="visually-hidden" role="status"></p>
  <main class="narrow">
    <section id="join">
      <header class="page-head">
        <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
        <h1 class="page-title">Gå med i spel</h1>
      </header>
      <p id="join-error" class="error-text" hidden></p>
      <form id="join-form">
        <label for="name-input">Ditt namn</label>
        <input id="name-input" maxlength="10" required autocomplete="nickname">
        <label for="code-input">Kod</label>
        <input id="code-input" maxlength="4" required autocapitalize="characters" class="code-input">
        <button class="big">Jag är med!</button>
      </form>
    </section>

    <section id="lobby" hidden>
      <header class="player-head">
        <div class="who">
          <div class="logo logo-small" aria-hidden="true"></div>
          <h1 id="category-name"></h1>
        </div>
      </header>

      <div id="waiting" class="card"><p id="waiting-text">Väntar på första låten…</p></div>

      <div id="guess" class="card" hidden>
        <h2 id="round-title" class="round-label"></h2>
        <div id="timer" class="ring mid-ring"></div>
        <label for="artist">Artist</label>
        <div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div>
        <label for="title">Titel</label>
        <div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div>
        <p class="note clip-note" hidden>Ljudklipp från Deezer</p>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div></div>

      <h2 class="section-title">Poäng</h2>
      <div id="standings" class="standings"></div>
    </section>

    <section id="join-info" class="card join-info-player" aria-label="Bjud in fler spelare" hidden>
      <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
      <div id="qr" class="qr"></div>
      <p>Du kan be andra spelare ansluta. De kan skanna QR-koden eller få <button type="button" id="copy-link" class="link" aria-label="Kopiera länken" title="Kopiera länken">länken</button> av dig.<span id="copy-status" class="visually-hidden" role="status"></span></p>
      <p id="join-url-row" hidden><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      <p>Kod: <span id="me" class="code"></span></p>
    </section>

    <div class="theme-row">
      <nav class="bottom-bar" aria-label="Meny"><button id="show-qr" class="icon-btn lobby-only" aria-controls="join-info" aria-expanded="false" aria-label="QR-kod" title="Visa QR-koden"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M520-120v-80h80v80h-80Zm-80-80v-200h80v200h-80Zm320-120v-160h80v160h-80Zm-80-160v-80h80v80h-80Zm-480 80v-80h80v80h-80Zm-80-80v-80h80v80h-80Zm360-280v-80h80v80h-80ZM170-650h140v-140H170v140Zm-50 20v-180q0-12.75 8.63-21.38Q137.25-840 150-840h180q12.75 0 21.38 8.62Q360-822.75 360-810v180q0 12.75-8.62 21.37Q342.75-600 330-600H150q-12.75 0-21.37-8.63Q120-617.25 120-630Zm50 460h140v-140H170v140Zm-50 20v-180q0-12.75 8.63-21.38Q137.25-360 150-360h180q12.75 0 21.38 8.62Q360-342.75 360-330v180q0 12.75-8.62 21.37Q342.75-120 330-120H150q-12.75 0-21.37-8.63Q120-137.25 120-150Zm530-500h140v-140H650v140Zm-50 20v-180q0-12.75 8.63-21.38Q617.25-840 630-840h180q12.75 0 21.38 8.62Q840-822.75 840-810v180q0 12.75-8.62 21.37Q822.75-600 810-600H630q-12.75 0-21.37-8.63Q600-617.25 600-630Zm80 510v-120h-80v-80h160v120h80v80H680ZM520-400v-80h160v80H520Zm-160 0v-80h-80v-80h240v80h-80v80h-80Zm40-200v-160h80v80h80v80H400Zm-190-90v-60h60v60h-60Zm0 480v-60h60v60h-60Zm480-480v-60h60v60h-60Z"/></svg></button><a class="icon-btn join-only" href="om.html" aria-label="Om spelet" title="Om spelet"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M430.5-720.59q-20.5-20.59-20.5-49.5t20.59-49.41q20.59-20.5 49.5-20.5t49.41 20.59q20.5 20.59 20.5 49.5t-20.59 49.41q-20.59 20.5-49.5 20.5t-49.41-20.59Zm14 586.01Q430-149.17 430-170v-380q0-20.83 14.62-35.42Q459.24-600 480.12-600q20.88 0 35.38 14.58Q530-570.83 530-550v380q0 20.83-14.62 35.42Q500.76-120 479.88-120q-20.88 0-35.38-14.58Z"/></svg></a><button class="icon-btn user-settings"></button></nav>
    </div>
  </main>

  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/play.js"></script>
</body>
</html>
