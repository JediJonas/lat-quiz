<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Låtquiz – Gå med i spel</title>
  <meta name="description" content="Gå med i ett låtquiz med din enhet och gissa artist och titel.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const d = document.documentElement.dataset, t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {}</script>
</head>
<body>
  <p id="announce" class="visually-hidden" role="status"></p>
  <main class="narrow">
    <section id="join">
      <header class="page-head">
        <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
        <h1 class="page-title">Gå med i spel</h1>
      </header>
      <p id="join-error" class="error-text" hidden></p>
      <form id="join-form">
        <div class="field-group">
          <div class="field-row"><label for="name-input">Namn</label><input id="name-input" maxlength="10" required autocomplete="nickname"></div>
        </div>
        <label for="code-input" class="section-title code-label">Kod</label>
        <div class="code-boxes">
          <span class="code-box" aria-hidden="true"></span><span class="code-box" aria-hidden="true"></span><span class="code-box" aria-hidden="true"></span><span class="code-box" aria-hidden="true"></span>
          <input id="code-input" maxlength="4" required autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-describedby="code-hint">
        </div>
        <p id="code-hint" class="note code-hint">Koden står under QR-koden hos spelledaren.</p>
        <button class="big">Jag är med!</button>
      </form>
    </section>

    <section id="lobby" hidden>
      <header class="player-head">
        <div class="who">
          <div class="logo logo-small" aria-hidden="true"></div>
          <h1 id="category-name"></h1>
        </div>
      </header>

      <section id="join-info" class="card join-info-player" aria-label="Bjud in fler spelare" hidden>
        <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
        <div id="qr" class="qr"></div>
        <p>Nya spelare kan skanna QR-koden, använda <button type="button" id="copy-link" class="link" aria-label="Kopiera länken" title="Kopiera länken">länken</button> eller ange kod:<span id="copy-status" class="visually-hidden" role="status"></span> <span id="me" class="code"></span></p>
        <p id="join-url-row" hidden><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      </section>

      <div id="waiting" class="card" hidden>
        <div class="cover waiting-cover"><h2 id="waiting-title" class="round-label"></h2>
          <p class="cover-foot"><span class="eq idle" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="waiting-text"></span></p></div>
        <ul id="rules" class="chips" aria-label="Regler"></ul>
      </div>

      <div id="guess" class="card" hidden>
        <div class="cover now-playing">
          <div class="cover-head"><h2 id="round-title" class="round-label"></h2><p class="round-label clip-note" hidden><span class="clip-from">Ljudklipp från </span>Deezer</p></div>
          <div id="timer" class="ring mid-ring"></div>
          <p class="cover-foot"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="guess-hint">Lyssna och gissa</span><button type="button" id="clip-sound" class="sound-button" hidden>Tryck för ljud</button></p>
        </div>
        <div class="field-group">
          <div class="field-row"><label for="artist">Artist</label><div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div></div>
          <div class="field-row"><label for="title">Titel</label><div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div></div>
        </div>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div></div>

      <div id="standings-section" hidden>
        <h2 class="section-title">Poäng</h2>
        <div id="standings" class="standings"></div>
      </div>
      <p id="win-wait" class="note win-wait" hidden>Revansch? Spelledaren kan starta en ny match.</p>
    </section>
  </main>

  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/play.js"></script>
</body>
</html>
