<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Låtquiz – Gå med i spel</title>
  <meta name="description" content="Gå med i ett låtquiz från mobilen och gissa artist och titel.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const t = localStorage.getItem('latquiz-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <p id="announce" class="visually-hidden" role="status"></p>
  <main class="narrow">
    <section id="join" hidden>
      <h1>Låtquiz – Gå med i spel</h1>
      <p id="join-error" class="error-text" hidden></p>
      <form id="join-form">
        <label for="name-input">Ditt namn</label>
        <input id="name-input" maxlength="20" required autocomplete="nickname">
        <label for="code-input">Kod</label>
        <input id="code-input" maxlength="4" required autocapitalize="characters" class="code-input">
        <button class="big">Gå med</button>
      </form>
    </section>

    <section id="lobby" hidden>
      <header class="player-head">
        <div class="who">
          <h1 id="category-name"></h1>
          <span id="me"></span>
        </div>
        <span id="conn" class="conn connecting" role="status">Ansluter …</span>
      </header>

      <div id="waiting" class="card"><p id="waiting-text">Väntar på första låten …</p></div>

      <div id="guess" class="card" hidden>
        <h2 id="round-title" class="round-label"></h2>
        <div id="timer" class="ring mid-ring"></div>
        <label for="artist">Artist</label>
        <div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div>
        <label for="title">Titel</label>
        <div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div>
      </div>

      <div id="result" class="card" hidden></div>

      <h2 class="section-title">Poäng</h2>
      <div id="standings"></div>
    </section>

  </main>

  <footer><button class="theme-switch"></button></footer>

  <script src="vendor/peerjs.min.js" defer></script>
  <script type="module" src="js/play.js"></script>
</body>
</html>
