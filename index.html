<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Låtquiz</title>
  <meta name="description" content="Låtquiz för familj och vänner. Gissa artist och titel i mobilen medan spelledaren spelar låtar i Spotify.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const t = localStorage.getItem('latquiz-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <main class="narrow">
    <h1>Låtquiz</h1>
    <p class="lead">Lyssna, gissa artist och låt, samla poäng!</p>
    <a class="button big" href="play.html">Gå med i spel</a>
    <a class="button secondary" href="host.html">Starta spel som spelledare</a>
    <p class="muted small">Spelledaren använder en dator med Spotify. Spelarna använder sina mobiler.</p>
    <p class="theme-row"><button class="theme-switch"></button></p>
  </main>
  <script>
    // Följ med eventuella testparametrar, till exempel en lokal PeerJS-server.
    for (const a of document.querySelectorAll('a')) a.search = location.search;
  </script>
  <script type="module">
    import { mountThemeSwitches } from './js/theme.js';
    mountThemeSwitches();
  </script>
</body>
</html>
