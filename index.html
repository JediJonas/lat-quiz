<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Låtquiz</title>
  <meta name="description" content="Låtquiz för familj och vänner. Gissa artist och titel med din enhet medan spelledaren spelar låtarna.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script>{ const d = document.documentElement.dataset; d.theme = 'dark'; try { const t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {} }</script>
  <!-- ?debug=1 visar versionsnumret längst ner och sparar valet på enheten, ?debug=0 döljer det igen. -->
  <script>{ const q = new URLSearchParams(location.search).get('debug'); let on = q !== null && q !== '0'; try { if (q === null) on = localStorage.getItem('latquiz-debug') === '1'; else if (on) localStorage.setItem('latquiz-debug', '1'); else localStorage.removeItem('latquiz-debug'); } catch {} if (on) document.documentElement.dataset.debug = ''; }</script>
</head>
<body>
  <main class="narrow start">
    <!-- Omslagen är bara utsmyckning och glider sakta förbi, som skivor i en hylla. Kategorierna väljs i Starta nytt spel. -->
    <div class="start-shelf" aria-hidden="true">
      <div class="shelf-row"><span class="tile" data-kategori="60-tal">60-tal</span><span class="tile" data-kategori="70-tal">70-tal</span><span class="tile" data-kategori="80-tal">80-tal</span><span class="tile" data-kategori="90-tal">90-tal</span><span class="tile" data-kategori="2000-tal">2000-tal</span><span class="tile" data-kategori="2010-tal">2010-tal</span></div>
      <div class="shelf-row"><span class="tile" data-kategori="2020-tal">2020-tal</span><span class="tile" data-kategori="svenska">Svenska klassiker</span><span class="tile" data-kategori="melodifestivalen">Melodifestivalen</span><span class="tile" data-kategori="eurovision">Eurovision</span><span class="tile" data-kategori="hardrock">Hårdrock och metal</span><span class="tile" data-kategori="edm">EDM</span></div>
      <div class="shelf-row"><span class="tile" data-kategori="eurovision">Eurovision</span><span class="tile" data-kategori="hardrock">Hårdrock och metal</span><span class="tile" data-kategori="edm">EDM</span><span class="tile" data-kategori="filmmusik">Filmmusik</span><span class="tile" data-kategori="klassiskt">Klassisk musik</span><span class="tile" data-kategori="60-tal">60-tal</span></div>
    </div>
    <div class="start-text">
      <h1 class="logo"><span class="visually-hidden">Låtquiz</span></h1>
      <p class="lead">Lyssna, gissa och<br>samla poäng!</p>
      <p class="start-sub">Spela med familj och vänner i mobilen.</p>
    </div>
    <div class="start-buttons">
      <a class="button big" href="play.html">Gå med i spel</a>
      <a class="button big soft" href="host.html">Starta nytt spel</a>
    </div>
    <!-- Versionen och när sidan publicerades. Fylls i vid publiceringen av verktyg/versioner.mjs och syns bara med ?debug=1. -->
    <p class="app-version"></p>
  </main>
  <script>
    // Följ med eventuella testparametrar, till exempel en lokal PeerJS-server.
    for (const a of document.querySelectorAll('a')) a.search = location.search;
  </script>
  <script type="module">
    import { commonItems, mountMenu, startItems } from './js/meny.js';
    mountMenu(document.querySelector('main'), () => [startItems(), commonItems()]);
  </script>
</body>
</html>
