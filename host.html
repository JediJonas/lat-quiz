<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Låtquiz – Starta nytt spel</title>
  <meta name="description" content="Starta ett låtquiz som spelledare. Spelarna går med i spelet med sina enheter, med QR-kod, kod eller länk.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const d = document.documentElement.dataset, t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {}</script>
</head>
<body>
  <p id="announce" class="visually-hidden" role="status"></p>

  <main id="setup" class="narrow">
    <header class="page-head">
      <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
      <h1 class="page-title">Starta nytt spel</h1>
    </header>
    <form id="setup-form">
      <div class="field-group">
        <div id="host-name-row" class="field-row">
          <label for="host-name">Ditt namn</label>
          <input id="host-name" maxlength="10" required autocomplete="nickname">
        </div>
        <div class="field-row">
          <label for="category-select">Kategori</label>
          <select id="category-select">
        <option value="60-tal">60-tal</option>
        <option value="70-tal">70-tal</option>
        <option value="80-tal">80-tal</option>
        <option value="90-tal">90-tal</option>
        <option value="2000-tal">2000-tal</option>
        <option value="2010-tal">2010-tal</option>
        <option value="svenska">Svenska klassiker</option>
        <option value="melodifestivalen">Melodifestivalen</option>
        <option value="eurovision">Eurovision</option>
        <option value="hardrock">Hårdrock och metal</option>
        <option value="filmmusik">Filmmusik</option>
        <option value="klassiskt">Klassisk musik</option>
        <option value="edm">EDM</option>
          </select>
        </div>
      </div>
      <p class="field-label">Inställningar</p>
      <div class="settings-summary">
        <p id="settings-text"></p>
        <button type="button" id="settings" class="soft" aria-label="Ändra inställningar" aria-describedby="settings-text">Ändra</button>
      </div>
      <button id="create" class="big">Dra igång!</button>
    </form>
    <div id="resume" hidden><button class="big soft"></button></div>
  </main>

  <main id="game" class="host" hidden>
    <section id="join-info" class="card join-info" aria-label="Gå med i spelet">
      <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
      <div id="qr" class="qr"></div>
      <p>Be spelarna skanna QR-koden eller skicka <button type="button" id="copy-link" class="link" aria-label="Kopiera länken" title="Kopiera länken">länken</button> till dem.<span id="copy-status" class="visually-hidden" role="status"></span></p>
      <p id="join-url-row" hidden><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      <p>Kod: <span id="code" class="code"></span></p>
    </section>
    <section class="main-col">
      <header class="player-head">
        <div class="who"><div class="logo logo-small" aria-hidden="true"></div><h1 id="category"></h1></div>
      </header>


      <div id="waiting" class="card"><p id="waiting-text"></p>
        <button type="button" id="start-game" class="big" hidden>Starta spelet</button></div>

      <div id="guess" class="card" hidden>
        <h2 id="round-title" class="round-label"></h2>
        <div id="timer" class="ring mid-ring"></div>
        <!-- Döljs när spelledaren inte deltar. -->
        <div class="guess-fields field-group">
          <div class="field-row"><label for="artist">Artist</label><div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div></div>
          <div class="field-row"><label for="title">Titel</label><div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div></div>
        </div>
        <p class="note clip-note" hidden>Ljudklipp från Deezer</p>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div>
        <button type="button" id="new-match" class="big" hidden>Ny match</button>
        <button type="button" id="next-song" class="big" hidden>Nästa låt</button></div>

      <div id="standings-section" hidden>
        <h2 class="section-title">Poäng</h2>
        <div id="standings" class="standings"></div>
      </div>
    </section>

    <!-- Spelledarens kontrollpanel, svävande längst ner. Ikoner: Material Symbols Rounded (Apache 2.0). -->
    <nav class="control-panel" aria-label="Spelledare">
      <button id="play" class="icon-btn" aria-label="Spela" title="Spela" disabled><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M320-258v-450q0-14 9-22t21-8q4 0 8 1t8 3l354 226q7 5 10.5 11t3.5 14q0 8-3.5 14T720-458L366-232q-4 2-8 3t-8 1q-12 0-21-8t-9-22Z"/></svg></button>
      <button id="pause" class="icon-btn" hidden aria-label="Pausa" title="Pausa" disabled><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M615-200q-24.75 0-42.37-17.63Q555-235.25 555-260v-440q0-24.75 17.63-42.38Q590.25-760 615-760h55q24.75 0 42.38 17.62Q730-724.75 730-700v440q0 24.75-17.62 42.37Q694.75-200 670-200h-55Zm-325 0q-24.75 0-42.37-17.63Q230-235.25 230-260v-440q0-24.75 17.63-42.38Q265.25-760 290-760h55q24.75 0 42.38 17.62Q405-724.75 405-700v440q0 24.75-17.62 42.37Q369.75-200 345-200h-55Z"/></svg></button>
      <button id="next" class="icon-btn" aria-label="Nästa låt" title="Nästa låt" disabled></button>
    </nav>
  </main>

  <script type="module" src="js/host.js"></script>
  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
</body>
</html>
