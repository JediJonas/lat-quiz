<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Låtquiz – Starta nytt spel</title>
  <meta name="description" content="Starta ett låtquiz som spelledare. Spelarna går med från mobilen med en kod eller QR-kod.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const d = document.documentElement.dataset, t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {}</script>
</head>
<body>
  <p id="announce" class="visually-hidden" role="status"></p>

  <main id="setup" class="narrow">
    <header class="page-head">
      <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
      <h1 class="page-title">Starta nytt spel</h1>
    </header>
    <form id="setup-form">
      <div class="switches host-plays"><button type="button" class="theme-switch" id="host-plays"></button></div>
      <div id="host-name-row">
        <label for="host-name">Ditt namn</label>
        <input id="host-name" maxlength="10" required autocomplete="nickname">
      </div>
      <label for="category-select">Kategori</label>
      <select id="category-select">
        <option value="60-tal">60-tal</option>
        <option value="70-tal">70-tal</option>
        <option value="80-tal">80-tal</option>
        <option value="90-tal">90-tal</option>
        <option value="2000-tal">2000-tal</option>
        <option value="2010-tal">2010-tal</option>
        <option value="svenska">Svenska klassiker</option>
        <option value="melodifestivalen">Melodifestivalen</option>
        <option value="eurovision">Eurovision</option>
        <option value="hardrock">Hårdrock och metal</option>
        <option value="filmmusik">Filmmusik</option>
        <option value="klassiskt">Klassisk musik</option>
        <option value="edm">EDM</option>
        <option value="deezer-test">Deezer-test</option>
      </select>
      <button id="create" class="big">Dra igång!</button>
    </form>
    <div id="resume" hidden><button class="secondary"></button></div>
    <p class="theme-row"><button id="settings" class="link">Inställningar</button><span class="row-end"><button class="link user-settings"></button></span></p>
  </main>

  <main id="game" class="host" hidden>
    <section id="join-info" class="card join-info" aria-label="Gå med i spelet">
      <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
      <div id="qr" class="qr"></div>
      <p>Be spelarna skanna QR-koden eller skicka <button type="button" id="copy-link" class="link" aria-label="Kopiera länken" title="Kopiera länken">länken</button> till dem.<span id="copy-status" class="visually-hidden" role="status"></span></p>
      <p id="join-url-row" hidden><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      <p>Kod: <span id="code" class="code"></span></p>
    </section>
    <section class="main-col">
      <header class="player-head">
        <div class="who"><div class="logo logo-small" aria-hidden="true"></div><h1 id="category"></h1></div>
      </header>

      <!-- Spelledarens ikonbar, under raden med kategorin. Ikoner: Material Symbols Rounded (Apache 2.0). -->
      <nav class="host-bar" aria-label="Spelledare">
        <div class="toolbar">
          <div class="tool-group">
            <button id="show-qr" class="icon-btn" aria-controls="join-info" aria-expanded="true" aria-label="QR-kod" title="Visa eller dölj QR-koden"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M520-120v-80h80v80h-80Zm-80-80v-200h80v200h-80Zm320-120v-160h80v160h-80Zm-80-160v-80h80v80h-80Zm-480 80v-80h80v80h-80Zm-80-80v-80h80v80h-80Zm360-280v-80h80v80h-80ZM170-650h140v-140H170v140Zm-50 20v-180q0-12.75 8.63-21.38Q137.25-840 150-840h180q12.75 0 21.38 8.62Q360-822.75 360-810v180q0 12.75-8.62 21.37Q342.75-600 330-600H150q-12.75 0-21.37-8.63Q120-617.25 120-630Zm50 460h140v-140H170v140Zm-50 20v-180q0-12.75 8.63-21.38Q137.25-360 150-360h180q12.75 0 21.38 8.62Q360-342.75 360-330v180q0 12.75-8.62 21.37Q342.75-120 330-120H150q-12.75 0-21.37-8.63Q120-137.25 120-150Zm530-500h140v-140H650v140Zm-50 20v-180q0-12.75 8.63-21.38Q617.25-840 630-840h180q12.75 0 21.38 8.62Q840-822.75 840-810v180q0 12.75-8.62 21.37Q822.75-600 810-600H630q-12.75 0-21.37-8.63Q600-617.25 600-630Zm80 510v-120h-80v-80h160v120h80v80H680ZM520-400v-80h160v80H520Zm-160 0v-80h-80v-80h240v80h-80v80h-80Zm40-200v-160h80v80h80v80H400Zm-190-90v-60h60v60h-60Zm0 480v-60h60v60h-60Zm480-480v-60h60v60h-60Z"/></svg></button>
            <button id="game-settings" class="icon-btn" aria-label="Inställningar" title="Inställningar"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M421-80q-14 0-25-9t-13-23l-15-94q-19-7-40-19t-37-25l-86 40q-14 6-28 1.5T155-226L97-330q-8-13-4.5-27t15.5-23l80-59q-2-9-2.5-20.5T185-480q0-9 .5-20.5T188-521l-80-59q-12-9-15.5-23t4.5-27l58-104q8-13 22-17.5t28 1.5l86 40q16-13 37-25t40-18l15-95q2-14 13-23t25-9h118q14 0 25 9t13 23l15 94q19 7 40.5 18.5T669-710l86-40q14-6 27.5-1.5T804-734l59 104q8 13 4.5 27.5T852-580l-80 57q2 10 2.5 21.5t.5 21.5q0 10-.5 21t-2.5 21l80 58q12 8 15.5 22.5T863-330l-58 104q-8 13-22 17.5t-28-1.5l-86-40q-16 13-36.5 25.5T592-206l-15 94q-2 14-13 23t-25 9H421Zm59-270q54 0 92-38t38-92q0-54-38-92t-92-38q-54 0-92 38t-38 92q0 54 38 92t92 38Z"/></svg></button>
          </div>
          <div class="tool-group">
            <button id="play" class="icon-btn" aria-label="Spela" title="Spela" disabled><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M320-258v-450q0-14 9-22t21-8q4 0 8 1t8 3l354 226q7 5 10.5 11t3.5 14q0 8-3.5 14T720-458L366-232q-4 2-8 3t-8 1q-12 0-21-8t-9-22Z"/></svg></button>
            <button id="pause" class="icon-btn" aria-label="Pausa" title="Pausa" disabled><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M615-200q-24.75 0-42.37-17.63Q555-235.25 555-260v-440q0-24.75 17.63-42.38Q590.25-760 615-760h55q24.75 0 42.38 17.62Q730-724.75 730-700v440q0 24.75-17.62 42.37Q694.75-200 670-200h-55Zm-325 0q-24.75 0-42.37-17.63Q230-235.25 230-260v-440q0-24.75 17.63-42.38Q265.25-760 290-760h55q24.75 0 42.38 17.62Q405-724.75 405-700v440q0 24.75-17.62 42.37Q369.75-200 345-200h-55Z"/></svg></button>
            <button id="next" class="icon-btn" aria-label="Nästa låt" title="Nästa låt" disabled></button>
          </div>
        </div>
      </nav>

      <div id="waiting" class="card"><p id="waiting-text"></p>
        <button type="button" id="start-game" class="big" hidden>Starta spelet</button></div>

      <div id="guess" class="card" hidden>
        <h2 id="round-title" class="round-label"></h2>
        <div id="timer" class="ring mid-ring"></div>
        <!-- Döljs när spelledaren inte deltar. -->
        <div class="guess-fields">
          <label for="artist">Artist</label>
          <div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div>
          <label for="title">Titel</label>
          <div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div>
        </div>
        <p class="clip-note" hidden>Ljudklipp från Deezer</p>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div>
        <button type="button" id="new-match" class="big" hidden>Ny match</button></div>

      <h2 class="section-title">Poäng</h2>
      <div id="standings" class="standings"></div>
      <p class="theme-row"><span class="row-end"><button class="link user-settings"></button></span></p>
    </section>
  </main>

  <script type="module" src="js/host.js"></script>
  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
</body>
</html>
