<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Låtquiz – Starta spel</title>
  <meta name="description" content="Starta ett låtquiz som spelledare. Spelarna går med från mobilen med en kod eller QR-kod.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const d = document.documentElement.dataset, t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {}</script>
</head>
<body>
  <p id="net-status" class="net-status" role="status" hidden></p>
  <p id="announce" class="visually-hidden" role="status"></p>

  <main id="setup" class="narrow">
    <header class="page-head">
      <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
      <h1 class="page-title">Starta spel</h1>
    </header>
    <form id="setup-form">
      <label for="host-name">Ditt namn</label>
      <input id="host-name" maxlength="10" required autocomplete="nickname">
      <label for="category-select">Kategori</label>
      <select id="category-select">
        <option value="60-tal">60-tal</option>
        <option value="70-tal">70-tal</option>
        <option value="80-tal">80-tal</option>
        <option value="90-tal">90-tal</option>
        <option value="2000-tal">2000-tal</option>
        <option value="2010-tal">2010-tal</option>
        <option value="svenska">Svenska klassiker</option>
        <option value="melodifestivalen">Melodifestivalen</option>
        <option value="eurovision">Eurovision</option>
        <option value="hardrock">Hårdrock och metal</option>
        <option value="filmmusik">Filmmusik</option>
        <option value="klassiskt">Klassisk musik</option>
        <option value="edm">EDM</option>
        <option value="deezer-test">Deezer-test</option>
      </select>
      <button id="create" class="big">Dra igång!</button>
    </form>
    <div id="resume" hidden><button class="secondary"></button></div>
    <p class="theme-row"><button id="settings" class="link">Inställningar</button><span class="row-end"><button class="link user-settings"></button></span></p>
  </main>

  <main id="game" class="host" hidden>
    <section id="join-info" class="card join-info" aria-label="Gå med i spelet">
      <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
      <div id="qr" class="qr"></div>
      <p>Be spelarna skanna eller gå till<br><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      <p>Kod: <span id="code" class="code"></span></p>
    </section>
    <section class="main-col">
      <header class="player-head">
        <div class="who"><div class="logo logo-small" aria-hidden="true"></div><h1 id="category"></h1></div>
        <span id="conn" class="conn connecting" role="status">Ansluter…</span>
      </header>
      <div id="waiting" class="card"><p id="waiting-text"></p></div>

      <div id="guess" class="card" hidden>
        <h2 id="round-title" class="round-label"></h2>
        <div id="timer" class="ring mid-ring"></div>
        <label for="artist">Artist</label>
        <div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div>
        <label for="title">Titel</label>
        <div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div>
        <p class="clip-note" hidden>Ljudklipp från Deezer</p>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div></div>

      <!-- Spelledarens panel: en rad med ikoner som har samma höjd hela spelet. Ikoner: Phosphor Icons (MIT). -->
      <section class="card controls" aria-labelledby="controls-title">
        <h2 id="controls-title" class="round-label">Spelledare</h2>
        <div class="toolbar">
          <div class="tool-group">
            <button id="show-qr" class="icon-btn" aria-controls="join-info" aria-expanded="true" aria-label="QR-kod" title="Visa eller dölj QR-koden"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M120,56v48a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40h48A16,16,0,0,1,120,56Zm-16,80H56a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,104,136Zm96-96H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40ZM144,184a8,8,0,0,0,8-8V144a8,8,0,0,0-16,0v32A8,8,0,0,0,144,184Zm64-32H184v-8a8,8,0,0,0-16,0v56H144a8,8,0,0,0,0,16h32a8,8,0,0,0,8-8V168h24a8,8,0,0,0,0-16Zm0,32a8,8,0,0,0-8,8v16a8,8,0,0,0,16,0V192A8,8,0,0,0,208,184Z"/></svg></button>
            <button id="game-settings" class="icon-btn" aria-label="Inställningar" title="Inställningar"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M237.94,107.21a8,8,0,0,0-3.89-5.4l-29.83-17-.12-33.62a8,8,0,0,0-2.83-6.08,111.91,111.91,0,0,0-36.72-20.67,8,8,0,0,0-6.46.59L128,41.85,97.88,25a8,8,0,0,0-6.47-.6A111.92,111.92,0,0,0,54.73,45.15a8,8,0,0,0-2.83,6.07l-.15,33.65-29.83,17a8,8,0,0,0-3.89,5.4,106.47,106.47,0,0,0,0,41.56,8,8,0,0,0,3.89,5.4l29.83,17,.12,33.63a8,8,0,0,0,2.83,6.08,111.91,111.91,0,0,0,36.72,20.67,8,8,0,0,0,6.46-.59L128,214.15,158.12,231a7.91,7.91,0,0,0,3.9,1,8.09,8.09,0,0,0,2.57-.42,112.1,112.1,0,0,0,36.68-20.73,8,8,0,0,0,2.83-6.07l.15-33.65,29.83-17a8,8,0,0,0,3.89-5.4A106.47,106.47,0,0,0,237.94,107.21ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z"/></svg></button>
          </div>
          <div class="tool-group">
            <button id="unknown" class="icon-btn" aria-pressed="false" aria-label="Okänd låt" title="Okänd låt: hoppa över den i kommande spel" disabled><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM112,168a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm0-120H96V40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8Z"/></svg></button>
            <button id="pause" class="icon-btn" aria-pressed="false" aria-label="Pausa" title="Pausa spelet" disabled><span class="when-off"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/></svg></span><span class="when-on"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg></span></button>
            <span id="controls"></span>
          </div>
        </div>
        <div id="controls-note"></div>
      </section>

      <h2 class="section-title">Poäng</h2>
      <div id="standings" class="standings"></div>
      <p class="theme-row"><span class="row-end"><button class="link user-settings"></button></span></p>
    </section>
  </main>

  <script type="module" src="js/host.js"></script>
  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
</body>
</html>
