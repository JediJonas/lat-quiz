<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Låtquiz – Starta nytt spel</title>
  <meta name="description" content="Starta ett låtquiz som spelledare. Spelarna går med i spelet med sina enheter, med QR-kod, kod eller länk.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script>{ const d = document.documentElement.dataset; d.theme = 'dark'; try { const t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {} }</script>
  <!-- ?debug=1 visar versionsnumret längst ner och sparar valet på enheten, ?debug=0 döljer det igen. -->
  <script>{ const q = new URLSearchParams(location.search).get('debug'); let on = q !== null && q !== '0'; try { if (q === null) on = localStorage.getItem('latquiz-debug') === '1'; else if (on) localStorage.setItem('latquiz-debug', '1'); else localStorage.removeItem('latquiz-debug'); } catch {} if (on) document.documentElement.dataset.debug = ''; }</script>
</head>
<body>
  <p id="announce" class="visually-hidden" role="status"></p>

  <main id="setup" class="narrow">
    <header class="page-head">
      <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
      <h1 class="page-title">Starta nytt spel</h1>
    </header>
    <form id="setup-form">
      <div class="field-group">
        <div id="host-name-row" class="field-row">
          <label for="host-name">Namn</label>
          <input id="host-name" maxlength="10" required autocomplete="nickname">
        </div>
        <div class="field-row cat-select-row">
          <label for="category-select">Kategori</label>
          <select id="category-select">
            <option value="60-tal">60-tal</option>
            <option value="70-tal">70-tal</option>
            <option value="80-tal">80-tal</option>
            <option value="90-tal">90-tal</option>
            <option value="2000-tal">2000-tal</option>
            <option value="2010-tal">2010-tal</option>
            <option value="2020-tal">2020-tal</option>
            <option value="edm">EDM</option>
            <option value="eurovision">Eurovision</option>
            <option value="filmmusik">Filmmusik</option>
            <option value="hardrock">Hårdrock och metal</option>
            <option value="klassiskt">Klassisk musik</option>
            <option value="melodifestivalen">Melodifestivalen</option>
            <option value="svenska">Svenska klassiker</option>
          </select>
        </div>
      </div>
      <fieldset class="cat-picker">
        <legend class="section-title">Kategori <span class="cat-count">14 kategorier</span></legend>
        <div id="category-picker" class="cat-shelf">
          <label class="cat-option"><input type="radio" name="category" value="60-tal" class="visually-hidden" checked><span class="tile" data-kategori="60-tal"></span><span class="cat-name">60-tal<span class="cat-songs">182 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="70-tal" class="visually-hidden"><span class="tile" data-kategori="70-tal"></span><span class="cat-name">70-tal<span class="cat-songs">146 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="80-tal" class="visually-hidden"><span class="tile" data-kategori="80-tal"></span><span class="cat-name">80-tal<span class="cat-songs">155 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="90-tal" class="visually-hidden"><span class="tile" data-kategori="90-tal"></span><span class="cat-name">90-tal<span class="cat-songs">158 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="2000-tal" class="visually-hidden"><span class="tile" data-kategori="2000-tal"></span><span class="cat-name">2000-tal<span class="cat-songs">166 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="2010-tal" class="visually-hidden"><span class="tile" data-kategori="2010-tal"></span><span class="cat-name">2010-tal<span class="cat-songs">174 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="2020-tal" class="visually-hidden"><span class="tile" data-kategori="2020-tal"></span><span class="cat-name">2020-tal<span class="cat-songs">176 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="edm" class="visually-hidden"><span class="tile" data-kategori="edm"></span><span class="cat-name">EDM<span class="cat-songs">156 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="eurovision" class="visually-hidden"><span class="tile" data-kategori="eurovision"></span><span class="cat-name">Eurovision<span class="cat-songs">208 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="filmmusik" class="visually-hidden"><span class="tile" data-kategori="filmmusik"></span><span class="cat-name">Filmmusik<span class="cat-songs">143 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="hardrock" class="visually-hidden"><span class="tile" data-kategori="hardrock"></span><span class="cat-name">Hårdrock och metal<span class="cat-songs">151 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="klassiskt" class="visually-hidden"><span class="tile" data-kategori="klassiskt"></span><span class="cat-name">Klassisk musik<span class="cat-songs">155 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="melodifestivalen" class="visually-hidden"><span class="tile" data-kategori="melodifestivalen"></span><span class="cat-name">Melodi&shy;festivalen<span class="cat-songs">210 låtar</span></span></label>
          <label class="cat-option"><input type="radio" name="category" value="svenska" class="visually-hidden"><span class="tile" data-kategori="svenska"></span><span class="cat-name">Svenska klassiker<span class="cat-songs">178 låtar</span></span></label>
        </div>
      </fieldset>
      <p class="section-title settings-label">Inställningar</p>
      <div class="settings-summary">
        <p id="settings-text"></p>
        <button type="button" id="settings" class="soft" aria-label="Ändra inställningar" aria-describedby="settings-text">Ändra</button>
      </div>
      <!-- I mobilen står knapparna fast längst ner, se .setup-actions i css/style.css. -->
      <div class="setup-actions">
        <button id="create" class="big">Dra igång!</button>
        <div id="resume" hidden><button type="button" class="big soft"></button></div>
      </div>
    </form>

    <!-- Versionen och när sidan publicerades. Fylls i vid publiceringen av verktyg/versioner.mjs och syns bara med ?debug=1. -->
    <p class="app-version"></p>
  </main>

  <main id="game" class="host" hidden>
    <section id="join-info" class="card join-info" aria-label="Gå med i spelet">
      <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
      <div id="qr" class="qr"></div>
      <p>Be spelarna skanna QR-koden, använda <button type="button" id="copy-link" class="link" aria-label="Kopiera länken" title="Kopiera länken">länken</button> eller ange kod:<span id="copy-status" class="visually-hidden" role="status"></span> <span id="code" class="code"></span></p>
      <p id="join-url-row" hidden><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
    </section>
    <section class="main-col">
      <header class="player-head">
        <div class="who"><div class="logo logo-small" aria-hidden="true"></div><h1 id="category"></h1></div>
      </header>


      <div id="waiting" class="card">
        <div class="cover waiting-cover"><div class="cover-head"><h2 id="waiting-title" class="round-label"></h2><p id="lobby-note" class="round-label clip-note" hidden><span class="clip-from">Ljudklipp från </span>Deezer</p></div>
          <p class="cover-foot"><span class="eq idle" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="waiting-text"></span></p></div>
        <div id="intro" class="cover win" hidden><div class="cover-head"><p class="round-label">Spelet börjar</p></div>
          <h2 class="win-title">Nu börjar det!</h2>
          <p id="intro-text" class="win-sub"><span id="intro-pie" class="pie"></span><span id="intro-label"></span></p></div>
        <ul id="rules" class="chips" aria-label="Regler"></ul>
        <button type="button" id="start-game" class="big" hidden>Starta spelet</button>
      </div>

      <div id="guess" class="card" hidden>
        <div class="cover now-playing">
          <div class="cover-head"><h2 id="round-title" class="round-label"></h2><p class="round-label clip-note"><span class="clip-from">Ljudklipp från </span>Deezer</p></div>
          <div id="timer" class="ring mid-ring"></div>
          <p class="cover-foot"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="guess-hint">Lyssna och gissa</span></p>
        </div>
        <!-- Döljs när spelledaren inte deltar. -->
        <div class="guess-fields field-group">
          <div class="field-row"><label for="artist">Artist</label><div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div></div>
          <div class="field-row"><label for="title">Titel</label><div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div></div>
        </div>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div>
        <button type="button" id="new-match" class="big" hidden>Spela igen</button></div>

      <div id="standings-section" hidden>
        <h2 class="section-title">Poäng</h2>
        <div id="standings" class="standings"></div>
      </div>

      <!-- Väntemusiken eller vinnarlåten som spelas, se js/nuspelas.js. Den står i spelets
           kolumn, så att den hamnar under spelet och inte under QR-koden på datorn. -->
      <p id="now-music" class="now-music" hidden></p>
    </section>

    <!-- Versionen och när sidan publicerades. Fylls i vid publiceringen av verktyg/versioner.mjs och syns bara med ?debug=1. -->
    <p class="app-version"></p>
  </main>

  <script type="module" src="js/host.js"></script>
  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
</body>
</html>
