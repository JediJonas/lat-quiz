<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Låtquiz – Starta spel</title>
  <meta name="description" content="Starta ett låtquiz som spelledare. Spelarna går med från mobilen med en kod eller QR-kod.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const t = localStorage.getItem('latquiz-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <p id="net-status" class="net-status" role="status" hidden></p>
  <p id="announce" class="visually-hidden" role="status"></p>

  <main id="setup" class="narrow">
    <h1>Låtquiz – Starta spel</h1>
    <label for="category-select">Kategori</label>
    <select id="category-select" disabled><option>Laddar kategorier …</option></select>
    <button id="create" class="big" disabled>Skapa spel</button>
    <div id="resume" hidden><button class="secondary"></button></div>
    <div class="settings-row">
      <p class="settings-link"><button id="settings" class="link">Inställningar</button>
        <span id="settings-summary" class="muted small"></span></p>
      <button class="theme-switch"></button>
    </div>
  </main>

  <main id="game" class="host" hidden>
    <section class="join-info" aria-label="Gå med i spelet">
      <div id="qr" class="qr"></div>
      <p>Skanna eller gå till<br><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      <p>Kod: <span id="code" class="code"></span></p>
    </section>
    <section class="main-col">
      <div class="game-head">
        <h1 id="category"></h1>
        <p id="game-settings-summary" class="muted small"></p>
      </div>
      <div id="stage" class="stage"></div>
      <h2 class="section-title">Poäng</h2>
      <div id="players"></div>
      <p class="actions">
        <button id="game-settings" class="link">Inställningar</button>
        <button id="end" class="link">Avsluta spelet</button>
        <button class="theme-switch"></button>
      </p>
    </section>
  </main>

  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/host.js"></script>
</body>
</html>
