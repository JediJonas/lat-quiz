<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Låtquiz – Starta spel</title>
  <meta name="description" content="Starta ett låtquiz som spelledare. Spelarna går med från mobilen med en kod eller QR-kod.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const d = document.documentElement.dataset, t = localStorage.getItem('latquiz-tema'), s = localStorage.getItem('latquiz-text'); if (t) d.theme = t; if (s) d.text = s; } catch {}</script>
</head>
<body>
  <p id="net-status" class="net-status" role="status" hidden></p>
  <p id="announce" class="visually-hidden" role="status"></p>

  <main id="setup" class="narrow">
    <header class="page-head">
      <a class="logo" href="index.html"><span class="visually-hidden">Låtquiz, till startsidan</span></a>
      <h1 class="page-title">Starta spel</h1>
    </header>
    <form id="setup-form">
      <label for="host-name">Ditt namn</label>
      <input id="host-name" maxlength="10" required autocomplete="nickname">
      <label for="category-select">Kategori</label>
      <select id="category-select">
        <option value="60-tal">60-tal</option>
        <option value="70-tal">70-tal</option>
        <option value="80-tal">80-tal</option>
        <option value="90-tal">90-tal</option>
        <option value="2000-tal">2000-tal</option>
        <option value="2010-tal">2010-tal</option>
        <option value="svenska">Svenska klassiker</option>
        <option value="melodifestivalen">Melodifestivalen</option>
        <option value="eurovision">Eurovision</option>
        <option value="hardrock">Hårdrock och metal</option>
        <option value="filmmusik">Filmmusik</option>
        <option value="klassiskt">Klassisk musik</option>
        <option value="edm">EDM</option>
        <option value="deezer-test">Deezer-test</option>
      </select>
      <button id="create" class="big">Dra igång!</button>
    </form>
    <div id="resume" hidden><button class="secondary"></button></div>
    <p class="theme-row"><button id="settings" class="link">Inställningar</button><span class="row-end"><button class="link user-settings"></button></span></p>
  </main>

  <main id="game" class="host" hidden>
    <section id="join-info" class="card join-info" aria-label="Gå med i spelet">
      <button id="hide-qr" class="close-qr" aria-label="Stäng QR-koden">×</button>
      <div id="qr" class="qr"></div>
      <p>Be spelarna skanna eller gå till<br><a id="join-url" href="play.html" target="_blank" rel="noopener"></a></p>
      <p>Kod: <span id="code" class="code"></span></p>
    </section>
    <section class="main-col">
      <header class="player-head">
        <div class="who"><div class="logo logo-small" aria-hidden="true"></div><h1 id="category"></h1></div>
        <span id="conn" class="conn connecting" role="status">Ansluter…</span>
      </header>
      <div id="waiting" class="card"><p id="waiting-text"></p></div>

      <div id="guess" class="card" hidden>
        <h2 id="round-title" class="round-label"></h2>
        <div id="timer" class="ring mid-ring"></div>
        <label for="artist">Artist</label>
        <div class="ac"><input id="artist" placeholder="Skriv minst 3 tecken"></div>
        <label for="title">Titel</label>
        <div class="ac"><input id="title" placeholder="Skriv minst 3 tecken"></div>
      </div>

      <div id="result" class="card" hidden><div id="result-body"></div></div>

      <!-- Spelledarens panel: det som bara spelledaren kan göra med låten. -->
      <section class="card controls" aria-labelledby="controls-title">
        <h2 id="controls-title" class="round-label">Spelledare</h2>
        <div id="controls"></div>
        <div class="panel-links">
          <button id="show-qr" class="link" aria-controls="join-info" aria-expanded="true" title="Visa eller dölj QR-koden"></button>
          <button id="game-settings" class="link">Inställningar</button>
          <button id="end" class="link">Avsluta</button>
          <button id="unknown" class="link" title="Låten hoppas över i kommande spel" hidden>Okänd låt</button>
        </div>
      </section>

      <h2 class="section-title">Poäng</h2>
      <div id="standings" class="standings"></div>
      <p class="theme-row"><span class="row-end"><button class="link user-settings"></button></span></p>
    </section>
  </main>

  <script type="module" src="js/host.js"></script>
  <script src="vendor/peerjs.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
</body>
</html>
