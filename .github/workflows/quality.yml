name: Webbkvalitet

on:
  pull_request:
  push:
    branches: [main]

jobs:
  webbkvalitet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quality/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tester och JSON
        run: npm test

      # Samma versionsnummer som vid publiceringen, så att kontrollerna gäller det som publiceras.
      - name: Versionsnummer på CSS och JS
        run: node tools/versions.mjs

      - name: Installera kontrollverktygen
        working-directory: quality
        run: npm ci

      - name: Lint (ESLint)
        working-directory: quality
        run: npm run lint

      - name: Typkontroll (JSDoc och tsc)
        working-directory: quality
        run: npm run types

      - name: Starta webbserver och PeerJS-server
        working-directory: quality
        run: |
          (cd .. && python3 -m http.server 8080 &)
          npx peerjs --host 127.0.0.1 --port 9000 &
          sleep 3

      - name: Röktest (ett helt spel)
        working-directory: quality
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: HTML-validering (W3C Nu)
        working-directory: quality
        run: npm run html

      - name: Tillgänglighet (axe, WCAG 2.2 AA)
        working-directory: quality
        run: npm run axe

      - name: Lighthouse (mobil)
        working-directory: quality
        run: npm run lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Länkkontroll
        working-directory: quality
        run: npm run links

      - name: Sidvikt
        working-directory: quality
        run: npm run -s page-weight >> "$GITHUB_STEP_SUMMARY" && cat "$GITHUB_STEP_SUMMARY"
