name: Publicera

# Publicerar sidan på GitHub Pages när main ändras. tools/build.mjs bundlar och minifierar
# JS och CSS och ger dem versionsnummer, så att webbläsaren hämtar nya filer i stället för
# gamla från cachen. Resultatet i _site/ är det som publiceras.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera esbuild
        run: npm ci

      - name: Bygg sidan (bundling, minifiering och versionsnummer)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
