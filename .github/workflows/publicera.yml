name: Publicera

# Publicerar sidan på GitHub Pages när main ändras. CSS och JS får versionsnummer
# vid publiceringen, så att webbläsaren hämtar nya filer i stället för gamla från cachen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versionsnummer på CSS och JS
        run: node verktyg/versioner.mjs

      - name: Samla sidan
        run: |
          mkdir _site
          cp -r *.html *.svg *.webmanifest css data ikoner js ljud vendor verktyg _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
